name: Windows credential isolation
on:
  pull_request:
    paths:
      - 'src/lib/security/credentialStore.server.ts'
      - 'scripts/validation/windows-credentials.cjs'
      - 'scripts/validation/windows-dpapi.ps1'
      - '.github/workflows/windows-dpapi.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cross-user-dpapi:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Verify product DPAPI under two Windows identities
        shell: pwsh
        run: |
          $env:CRB_TEMP_ROOT = [IO.Path]::GetFullPath((Join-Path $env:GITHUB_WORKSPACE '../.tmp'))
          ./scripts/validation/windows-dpapi.ps1 -CreateTestUser
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain synthetic result only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-dpapi-result
          path: '${{ github.workspace }}/../.tmp/validation/windows-dpapi/result.json'
          if-no-files-found: error
          retention-days: 7
